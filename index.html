<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickCDN - 快速、可靠的公共资源库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.quickso.cn/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#27ae60',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    <!-- 导航栏 -->
    <nav class="bg-white dark:bg-gray-800 shadow-md fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-bold text-primary">QuickCDN</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-700 dark:text-gray-200 hover:text-primary">首页</a>
                    <a href="https://github.com/muzihuaner/quickCDN" class="text-gray-700 dark:text-gray-200 hover:text-primary">Github</a>
                    <a href="/about.html" class="text-gray-700 dark:text-gray-200 hover:text-primary">关于</a>
                    <button id="darkModeToggle" class="text-gray-700 dark:text-gray-200">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:block"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="pt-20 pb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- 收录统计 -->
            <div class="text-center mb-8">
                <p class="text-gray-600 dark:text-gray-400">
                    共收录了 <span id="total-libraries" class="text-primary font-semibold">...</span> 个前端静态库
                </p>
            </div>

            <!-- 搜索框 -->
            <div class="max-w-3xl mx-auto mb-8">
                <div class="relative">
                    <input type="text" id="text" 
                        class="w-full px-4 py-3 rounded-lg bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 focus:border-primary dark:focus:border-primary focus:ring-2 focus:ring-primary/20 dark:text-white" 
                        placeholder="搜索 JavaScript 库...">
                    <button class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-primary">
                        <i class="fas fa-search text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- 常用包展示 -->
            <div id="common-packages" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
                <!-- 常用包将通过 JavaScript 动态添加 -->
            </div>

            <!-- 搜索结果 -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
                <div class="p-4 border-b dark:border-gray-700">
                    <div class="package-amount">
                        找到 <strong>0</strong> 个包
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <tbody class="user divide-y dark:divide-gray-700">
                            <!-- 搜索结果将通过 JavaScript 动态添加 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white dark:bg-gray-800 shadow-md mt-8">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <!-- 友情链接 -->
            <div class="mb-8">
                <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4 text-center">友情链接</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <a href="https://cdn.jsdelivr.net" target="_blank" 
                        class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors text-center">
                        jsDelivr
                    </a>
                    <a href="https://cdnjs.com" target="_blank"
                        class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors text-center">
                        CDNJS
                    </a>
                    <a href="https://cdnjs.cloudflare.com/" target="_blank"
                        class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors text-center">
                        Cloudflare
                    </a>
                    <a href="https://unpkg.com" target="_blank"
                        class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors text-center">
                        UNPKG
                    </a>
                </div>
            </div>
            
            <div class="text-center text-gray-600 dark:text-gray-400 pt-4 border-t border-gray-200 dark:border-gray-700">
                
                <script type="text/javascript">
                    copyright = new Date();//取得当前的日期
                    update = copyright.getFullYear();//取得当前的年份
                    document.write('<p>' + "Copyright © 2016-" + update + ' <a href="https://huangetech.github.io/" title="按下“Ctrl+D”试试？"><b>欢哥科技</b></a> All rights reserved. ' + '</p>');

                </script>
            </div>
        </div>
    </footer>

    <script src="js/search.js"></script>
</body>
</html>
